name: ci

# Every branch that the release process uses (AGENTS.md §9) is checked: `dev` and `release/<version>`
# are where work actually happens, `main` is only ever a merge of a stabilised branch.
on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:

permissions:
  contents: read

env:
  # Explicit patterns: `references/` holds third-party Go source inside this module's tree and
  # `./...` would compile it.
  PKGS: ./cmd/... ./internal/...

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal deploy test)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"; echo "$out"; exit 1
          fi

      - run: go vet $PKGS

      - name: vet the lab harness
        run: go vet -tags=lab ./test/lab

      - run: go test -race $PKGS

      - name: build (linux/amd64, linux/arm64)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath $PKGS
          GOOS=linux GOARCH=arm64 go build -trimpath $PKGS

      - name: release tool tests
        run: |
          go vet ./deploy/release
          go test ./deploy/release

  # The dependency set is small on purpose; this is what keeps it honest, and it is the only gate that
  # looks at the standard library's own advisories as well as our direct modules.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 $PKGS

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Built from source with the module's own toolchain. A prebuilt golangci-lint binary carries the
      # Go version it was compiled with and refuses a module that targets a newer one — v1.64 (go1.24)
      # could not analyse a go 1.27 module at all, and v2 only works when the release's toolchain is
      # new enough. Building it here removes the question.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run ./cmd/... ./internal/...
