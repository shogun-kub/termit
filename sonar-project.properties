# SonarQube Server (self-hosted). The server is reachable only from the LAN, so the scan is a manual
# step run on the lab MN — see AGENTS.md §4.2.
sonar.projectKey=Termit
sonar.projectName=Termit
sonar.go.coverage.reportPaths=coverage.out
# Without these the scanner guesses which files are tests from their path, and the guess decides what
# the coverage report is measured against. `.` plus the test inclusions is the documented recipe for Go.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# `references/` is third-party GPL source that is never part of the product (§2.1); the rest is scratch.
sonar.exclusions=references/**,.spike-out/**,.dev/**,dist/**,**/*_test.go
