# SonarQube Server (self-hosted). The server is reachable only from the LAN, so the scan is a manual
# step run from a developer machine — see AGENTS.md §4.2. CI stays out of it.
sonar.projectKey=Termit
sonar.projectName=Termit
sonar.go.coverage.reportPaths=coverage.out
# `references/` is third-party GPL source that is never part of the product (§2.1); the rest is scratch.
sonar.exclusions=references/**,.spike-out/**,.dev/**,dist/**
