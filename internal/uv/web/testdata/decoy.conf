# Decoy endpoints, generated by termit-uv from the site data.
# Do not edit: `termit-uv renew-site` rewrites this file.

error_page 404 /404.html;

location = /auth/token {
    if ($request_method != POST) {
        return 405;
    }
    default_type application/json;
    add_header Set-Cookie "session=5d954c9b2cb8ff8f61ad14d7421e35c2; Path=/; HttpOnly; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-Id $request_id always;
    return 401 '{"error":"auth_required","message":"The credential pair is not recognised for this deployment."}';
}
