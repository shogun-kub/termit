# Decoy endpoints, generated by termit-uv from the site data.
# Do not edit: `termit-uv renew-site` rewrites this file.

error_page 404 /404.html;

location = /session/verify {
    if ($request_method != POST) {
        return 405;
    }
    default_type application/json;
    add_header Set-Cookie "session=3b7208221a6f4dce556c461b47a88470; Path=/; HttpOnly; SameSite=Lax" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-Id $request_id always;
    return 401 '{"error":"invalid_credentials","message":"This account is not permitted to open a session right now."}';
}
